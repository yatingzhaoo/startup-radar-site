name: Daily startup radar update

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      repair_company_entities:
        description: "Replace model or feature launches incorrectly listed as companies"
        required: false
        default: false
        type: boolean
      backfill_start_date:
        description: "First missing date to generate (YYYY-MM-DD)"
        required: false
        type: string
      backfill_end_date:
        description: "Last missing date to generate (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-startup-radar-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate and verify feed
        if: ${{ !inputs.repair_company_entities }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BACKFILL_START_DATE: ${{ inputs.backfill_start_date }}
          BACKFILL_END_DATE: ${{ inputs.backfill_end_date }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          TODAY="$(TZ=America/Los_Angeles date +%F)"
          if [ -n "$BACKFILL_START_DATE" ] || [ -n "$BACKFILL_END_DATE" ]; then
            test -n "$BACKFILL_START_DATE"
            test -n "$BACKFILL_END_DATE"
            [[ "$BACKFILL_START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            [[ "$BACKFILL_END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            if [[ "$BACKFILL_START_DATE" > "$BACKFILL_END_DATE" ]]; then
              echo "Backfill start date must not be after end date"
              exit 1
            fi
            CURRENT_DATE="$BACKFILL_START_DATE"
            while true; do
              node scripts/generate-static-day.mjs "$CURRENT_DATE"
              if [ "$CURRENT_DATE" = "$BACKFILL_END_DATE" ]; then
                break
              fi
              CURRENT_DATE="$(date -u -d "$CURRENT_DATE + 1 day" +%F)"
            done
            LATEST_DATE="$(node -e "const feed=require('./src/data/feed.json'); process.stdout.write(feed.days[0].date)")"
            node scripts/validate-static-feed.mjs "$LATEST_DATE"
          else
            node scripts/generate-static-day.mjs "$TODAY"
            node scripts/validate-static-feed.mjs "$TODAY"
          fi
          npm run build

      - name: Repair non-company entries
        if: ${{ inputs.repair_company_entities }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          npm run fix:company-entities
          node scripts/validate-static-feed.mjs
          npm run build

      - name: Save the successful feed
        run: |
          TODAY="$(TZ=America/Los_Angeles date +%F)"
          git config user.name "daily-startup-radar-bot"
          git config user.email "daily-startup-radar-bot@users.noreply.github.com"
          git add src/data/feed.json src/data/reading-history.json
          if git diff --cached --quiet; then
            echo "No content change"
            exit 0
          fi
          if [ "${{ inputs.repair_company_entities }}" = "true" ]; then
            git commit -m "Remove non-company entries from startup radar"
          elif [ -n "${{ inputs.backfill_start_date }}" ]; then
            git commit -m "Backfill startup radar ${{ inputs.backfill_start_date }} through ${{ inputs.backfill_end_date }}"
          else
            git commit -m "Update startup radar ${TODAY}"
          fi
          git push
